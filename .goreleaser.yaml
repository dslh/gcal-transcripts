version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: gcal-transcripts
    binary: gcal-transcripts
    main: ./cmd/gcal-transcripts
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    # The OAuth client comes from repository secrets, never from source. The
    # release workflow refuses to run with either one empty.
    ldflags:
      - -s -w
      - -X main.Version={{.Version}}
      - -X main.Commit={{.ShortCommit}}
      - -X main.Date={{.Date}}
      - -X github.com/dslh/gcal-transcripts/internal/auth.embeddedClientID={{.Env.GCAL_TRANSCRIPTS_CLIENT_ID}}
      - -X github.com/dslh/gcal-transcripts/internal/auth.embeddedClientSecret={{.Env.GCAL_TRANSCRIPTS_CLIENT_SECRET}}

archives:
  - id: default
    formats:
      - tar.gz
    # Windows users expect zip; Scoop downloads these.
    format_overrides:
      - goos: windows
        formats:
          - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

# Cask, not formula, as in dslh/mm: `brews` is deprecated since GoReleaser
# v2.10. Casks are macOS-only, so Linux users install from the release tarball.
homebrew_casks:
  - name: gcal-transcripts
    repository:
      owner: dslh
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/dslh/gcal-transcripts"
    description: "Download Google Calendar meeting transcripts as markdown"
    license: "MIT"
    # The binaries are unsigned, so without this Gatekeeper quarantines them
    # and the first run dies with "developer cannot be verified".
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gcal-transcripts"]
          end

scoops:
  - repository:
      owner: dslh
      name: scoop-bucket
      token: "{{ .Env.SCOOP_BUCKET_TOKEN }}"
    homepage: "https://github.com/dslh/gcal-transcripts"
    description: "Download Google Calendar meeting transcripts as markdown"
    license: "MIT"
