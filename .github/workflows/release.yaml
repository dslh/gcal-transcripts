name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Check the OAuth client is configured
        # An unset secret reaches GoReleaser as an empty string, which would
        # ship a binary nobody can sign in with.
        run: test -n "$GCAL_TRANSCRIPTS_CLIENT_ID" && test -n "$GCAL_TRANSCRIPTS_CLIENT_SECRET"
        env:
          GCAL_TRANSCRIPTS_CLIENT_ID: ${{ secrets.GCAL_TRANSCRIPTS_CLIENT_ID }}
          GCAL_TRANSCRIPTS_CLIENT_SECRET: ${{ secrets.GCAL_TRANSCRIPTS_CLIENT_SECRET }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}
          GCAL_TRANSCRIPTS_CLIENT_ID: ${{ secrets.GCAL_TRANSCRIPTS_CLIENT_ID }}
          GCAL_TRANSCRIPTS_CLIENT_SECRET: ${{ secrets.GCAL_TRANSCRIPTS_CLIENT_SECRET }}
